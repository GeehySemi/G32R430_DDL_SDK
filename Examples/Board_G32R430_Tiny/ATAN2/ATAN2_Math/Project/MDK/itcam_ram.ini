Define unsigned int START_ADDR;
START_ADDR = 0x00000000;

FUNC void OnResetExec (void) {   // Executes upon software RESET
    SP= _RDWORD(START_ADDR);
    PC= _RDWORD(START_ADDR+4);
    xPSR |= (1 << 24);
}

LOAD %L INCREMENTAL

SP= _RDWORD(START_ADDR);
PC= _RDWORD(START_ADDR+4);
xPSR |= (1 << 24);